[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lre"
version = "0.1.0"
description = "Legacy Land Record Digitisation and Validation Engine (CA-1 project)"
readme = "README.md"
requires-python = ">=3.11"  # local pins (requirements.txt) target 3.11; Colab uses its own newer Python + CUDA torch
authors = [
  { name = "Chayan Khatua" },
  { name = "Aditya Kumar Singh" },
]

[project.scripts]
lre = "lre.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
